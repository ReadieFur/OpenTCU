#region Boards
[env:esp32_c6]
extends = globals
board = esp32-c6-devkitm-1
board_build.partitions = c6_partition_table.csv

[env:esp32_c6_dev]
extends = globals, esp32_c6, debug
board = esp32-c6-devkitm-1
board_build.partitions = c6_partition_table.csv
debug_tool = esp-builtin
debug_server =
	${debug.debug_server}
	${platformio.packages_dir}/tool-openocd-esp32/share/openocd/scripts/board/esp32c6-builtin.cfg
build_flags =
	${globals.build_flags}
	${debug.build_flags}
#endregion

[globals]
platform =  espressif32@6.10.0
framework = espidf
build_type = release
build_flags =
	-std=c++17
	-std=gnu++17
	; https://docs.elegantota.pro/async-mode/#enabling-async-mode
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-Wno-unknown-pragmas ;https://stackoverflow.com/questions/12894454/how-to-remove-gcc-warning-on-pragma-region
	-DCORE_DEBUG_LEVEL=5 ;https://community.platformio.org/t/how-to-set-up-log-level-to-be-able-to-debug-the-esp32/8278
	-Wno-format ;Caused by a format error within esp_log.h
	-Wno-missing-field-initializers
	-Wno-unused-variable
	-Wno-comment
	-fexceptions
	-DCONFIG_NIMBLE_CPP_IDF=1 ;https://github.com/h2zero/esp-nimble-cpp/issues/407
build_unflags =
	-std=gnu++11
	-fno-exceptions
	-fno-rtti
monitor_raw = yes
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@^7.2.1
	h2zero/esp-nimble-cpp@^2.4.0

[debug]
build_type = debug
lib_extra_dirs = components
test_framework = unity
test_speed = 115200
monitor_speed = 230400
debug_init_break = break setup
debug_server = 
	${platformio.packages_dir}/tool-openocd-esp32/bin/openocd
	-f
build_flags =
	-D DEBUG_LOG_LEVEL=ESP_LOG_DEBUG
	-D DEBUG
	;https://github.com/espressif/openocd-esp32/issues/246
	-O0
	-g
	-D CONFIG_COMPILER_OPTIMIZATION_NONE
	; -v
lib_ldf_mode = deep ;https://github.com/me-no-dev/ESPAsyncWebServer/issues/520
